<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Geist+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --rose: #f43f5e;
        --emerald: #10b981;
        --ink: #09090b;
        --font: "Poppins", system-ui, sans-serif;
        --mono: "Geist Mono", ui-monospace, monospace;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1200px; height: 630px; overflow: hidden; }
      .card {
        width: 1200px;
        height: 630px;
        position: relative;
        background:
          radial-gradient(900px 520px at 82% 42%, rgba(244, 63, 94, 0.07), transparent 62%),
          linear-gradient(158deg, #131317 0%, #0a0a0d 58%, #08080a 100%);
        color: #fff;
        font-family: var(--font);
        display: flex;
        flex-direction: column;
      }

      /* terminal top bar */
      .bar {
        height: 62px;
        flex: 0 0 62px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 24px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      }
      .bar__left { display: flex; align-items: center; gap: 14px; }
      .dots { display: flex; gap: 8px; }
      .dots span { width: 12px; height: 12px; border-radius: 50%; }
      .dots span:nth-child(1) { background: #ff5f57; }
      .dots span:nth-child(2) { background: #febc2e; }
      .dots span:nth-child(3) { background: #28c840; }
      .bar__path { font-family: var(--mono); font-size: 15px; color: rgba(255, 255, 255, 0.55); }
      .bar__host { font-family: var(--mono); font-size: 14px; color: rgba(255, 255, 255, 0.3); letter-spacing: 0.01em; }

      /* body */
      .body {
        flex: 1 1 auto;
        display: flex;
        align-items: stretch;
        gap: 44px;
        padding: 44px 44px 40px 48px;
      }
      .left { flex: 1 1 auto; display: flex; flex-direction: column; min-width: 0; }
      .eyebrow {
        font-family: var(--mono);
        font-size: 18px;
        font-weight: 500;
        color: var(--rose);
        letter-spacing: 0.02em;
        margin-bottom: 22px;
      }
      h1 {
        font-weight: 800;
        text-transform: uppercase;
        font-size: 66px;
        line-height: 1.06;
        letter-spacing: -0.02em;
        color: #fff;
      }
      .subtitle {
        font-family: var(--mono);
        font-size: 20px;
        color: rgba(255, 255, 255, 0.5);
        margin-top: 26px;
      }
      .subtitle strong { color: #fff; font-weight: 600; }

      .badges { display: flex; gap: 10px; margin-top: auto; flex-wrap: wrap; }
      .pill {
        font-family: var(--mono);
        font-size: 15px;
        font-weight: 500;
        display: inline-flex;
        align-items: center;
        gap: 9px;
        padding: 12px 17px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(255, 255, 255, 0.12);
        color: rgba(255, 255, 255, 0.62);
      }
      .pill--white {
        background: #fff;
        border-color: #fff;
        color: var(--ink);
        font-weight: 600;
      }
      .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--emerald); }

      /* photo panel */
      .photo {
        flex: 0 0 372px;
        position: relative;
        border-radius: 20px;
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, 0.1);
        box-shadow: 0 30px 80px rgba(0, 0, 0, 0.45);
      }
      .photo img { width: 100%; height: 100%; object-fit: cover; object-position: center 22%; display: block; }
      .photo::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(to top, rgba(0, 0, 0, 0.55), transparent 42%);
      }
      .photo__badge {
        position: absolute;
        left: 16px;
        bottom: 16px;
        z-index: 2;
        font-family: var(--mono);
        font-size: 14px;
        font-weight: 600;
        display: inline-flex;
        align-items: center;
        gap: 9px;
        padding: 9px 14px;
        border-radius: 999px;
        background: rgba(9, 9, 11, 0.68);
        border: 1px solid rgba(255, 255, 255, 0.16);
        color: #fff;
        backdrop-filter: blur(6px);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="bar">
        <div class="bar__left">
          <div class="dots"><span></span><span></span><span></span></div>
          <div class="bar__path">salem@portfolio ~ %</div>
        </div>
        <div class="bar__host">salems.website</div>
      </div>

      <div class="body">
        <div class="left">
          <div class="eyebrow">[ Hello, I'm Salem ]</div>
          <h1>Obsesses over pixels.<br />Ships real products.</h1>
          <div class="subtitle"><strong>Salem Alazzawi</strong> — Software Engineer · Sharjah, UAE</div>
          <div class="badges">
            <span class="pill pill--white"><span class="dot"></span>Available for work</span>
            <span class="pill">4+ yrs shipping</span>
            <span class="pill">17+ websites</span>
            <span class="pill">solo builder</span>
          </div>
        </div>

        <div class="photo">
          <img src="file:///Users/salemalazzawi/Desktop/MyPortfolio/public/assets/portfolio.jpg" alt="Salem Alazzawi" />
          <span class="photo__badge"><span class="dot"></span>Design &amp; Build</span>
        </div>
      </div>
    </div>
  </body>
</html>
